name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image = postgres:16 + the `vector` extension (RAG store).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brio
          POSTGRES_PASSWORD: brio
          POSTGRES_DB: brio_pm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both Alembic (settings.database_url) and the test conftest read this.
      DATABASE_URL: postgresql+psycopg://brio:brio@localhost:5432/brio_pm
      # ⚠️ A SEPARATE database. The fixtures DELETE every row from the domain
      # tables, so they must never point at the one the migrations just built,
      # and conftest refuses any name that does not look like a throwaway.
      TEST_DATABASE_URL: postgresql+psycopg://brio:brio@localhost:5432/brio_pm_test
      # Turns an absent TEST_DATABASE_URL from a silent skip into a hard error.
      # Without it the run goes green while the database tests do not run, which
      # is exactly what happened here for weeks.
      REQUIRE_DB_TESTS: "1"
      # Dummies so config + injectable clients import cleanly. The AI tests use
      # a mock Anthropic client (dependency-injected), so no real key is called.
      ANTHROPIC_API_KEY: dummy-ci-key
      # test_require_owner_allows_owner asserts this exact owner email is allowed.
      AUTH_ALLOWED_EMAILS: amir@sister-co.example

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # WeasyPrint (PDF generation, imported transitively by app routers) needs
      # native Pango/Cairo/GDK-Pixbuf libs at import time.
      - name: Install system libraries (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev shared-mime-info

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Build the real schema via migrations (some tables — e.g. estimate_versions
      # — exist only in migrations, not as ORM models, so create_all alone can't
      # resolve their FKs). conftest's create_all then no-ops over the existing tables.
      - name: Create the throwaway test database
        env:
          PGPASSWORD: brio
        run: |
          psql -h localhost -U brio -d postgres -c 'CREATE DATABASE brio_pm_test'
          psql -h localhost -U brio -d brio_pm_test -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest -q -rs
